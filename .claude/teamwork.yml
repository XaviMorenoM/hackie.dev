version: 1

project:
  name: hackie.dev
  summary: "Product landing page for a gym-tracker iOS app (Alterio/Hackie). Astro 7 · TypeScript · Tailwind v4 · static output · 3 locales (en/es/ca) · deployed to GitHub Pages."
  stack: [astro, typescript, tailwind, node]
  platforms: [web]

roles: [lead, design, implement, validate, submit]

vcs:
  base: main
  branch_prefixes: [feat, fix, chore, refactor]
  pr: gh
  merge: squash
  replay: cherry-pick

setup:
  - npm ci

gates:
  - {id: typecheck, run: "npm run check", stage: implement}
  - {id: build,     run: "npm run build", stage: implement}
  - {id: format,    run: "npm run format:check", stage: implement, planned: true}
  - {id: lint,      run: "npm run lint", stage: implement, planned: true}
  - {id: unit,      run: "npm run test:unit", stage: implement, planned: true}
  - {id: e2e,       run: "npx playwright test {targets}", all: "npx playwright test", stage: validate, planned: true}

tests:
  - {id: unit, owner: implement, location: "src/**/*.test.ts", required_for: always}
  - {id: e2e,  owner: validate,  location: "tests/e2e/",       required_for: user_flow_change}

design:
  trigger: lead_flag
  mockups: figma
  checks: [dark mode, mobile layout, locale text overflow, contrast, reduced motion]

tracker:
  kind: github
  repo: XaviMorenoM/hackie.dev
  done: close

docs:
  read_first: [CLAUDE.md, README.md]

guardrails:
  never: ["git push --force", "--no-verify"]
  human_only: ["GitHub Pages custom domain settings"]

waves: {max_parallel: 3, max_bounces: 3}
models: {lead: opus, design: opus, implement: sonnet, validate: sonnet, submit: sonnet}

role_notes:
  lead: >
    For UI-change tickets, run a design-prep phase BEFORE writing the implementation
    spec: spawn a UX analysis agent and a design agent to generate 2-3 design proposals.
    Post rendered screenshots or Figma links to the GitHub issue and wait for the user
    to select one before finalising the spec.
  design: >
    Your role starts BEFORE implementation. Generate 2-3 distinct design proposals
    (layout, colour, or copy variations) and post them to the GitHub issue as screenshots
    or Figma links. Implementation does not start until the user selects a proposal.
  implement: >
    When running the dev server for live review, use a unique port to avoid collisions:
    `npm run dev -- --port <PORT>`. Choose 4322+ and include the URL in your report
    labeled with your branch name, e.g.
    "Preview: http://localhost:4325 (feat/hero-redesign)".
